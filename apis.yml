aid: pavilion-data
name: Pavilion
description: Pavilion Data Systems was a San Jose, California storage company founded in 2014 by Kiran
  Malwankar, Sundar Kanthadai and VR Satish. It built the Pavilion HyperParallel Flash Array (HFA) — a
  rack-scale NVMe-over-Fabrics array with up to 20 controllers and 72 SSDs in a 4U chassis — running its
  own HyperOS storage operating system, later extended with the HyperParallel File System for AI, analytics
  and HPC workloads. The product datasheet advertised flexible management through a RESTful API, DMTF
  Redfish and SNIA Swordfish, a web GUI and a CLI, plus vCenter, Kubernetes and OpenStack integrations,
  but that management reference shipped with the appliance and was never published at a public developer
  URL. The company ceased operations on 12 October 2022 after attempts to sell the business and to raise
  a further round both failed, and pavilion.io no longer serves HTTP.
